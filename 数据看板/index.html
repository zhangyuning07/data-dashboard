<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据集分析看板</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js">
</script>
<style>
  :root {
    --bg: #f2f3f7;
    --card-bg: #ffffff;
    --primary: #6c5ce7;
    --primary-dark: #5a4bd1;
    --accent: #4a90d9;
    --accent-light: #e8f0fe;
    --text: #2c3e50;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.07);
    --radius: 10px;
    --radius-sm: 6px;
    --transition: 0.2s ease;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ===== Header / 标题说明区 ===== */
  .header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 28px 40px;
    text-align: center;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .header-desc {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  /* ===== Upload / 文件上传区 ===== */
  .upload-section {
    max-width: 800px;
    margin: 24px auto 0;
    padding: 0 20px;
  }
  .drop-zone {
    border: 2px dashed #c4c7d0;
    border-radius: var(--radius);
    padding: 36px 24px;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
    background: #fafbfc;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--primary);
    background: #f8f7ff;
  }
  .drop-zone-icon { font-size: 40px; margin-bottom: 8px; }
  .drop-zone-text { font-size: 15px; color: var(--text); }
  .drop-zone-hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 10px 24px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
  }
  .upload-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
  #fileInput { display: none; }
  .file-loaded {
    display: none;
    margin-top: 12px;
    padding: 10px 16px;
    background: #ecfdf5;
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: #065f46;
  }
  .file-loaded.show { display: block; }

  /* ===== Container ===== */
  .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ===== Tab Navigation / 标签导航区 ===== */
  .tab-nav-wrap {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
    margin-bottom: 24px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .tab-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    padding: 10px 8px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .tab-btn {
    flex-shrink: 0;
    padding: 8px 16px;
    border: none;
    background: transparent;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: var(--transition);
    white-space: nowrap;
  }
  .tab-btn:hover { background: #f3f4f6; color: var(--text); }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 6px rgba(74,144,217,0.3);
  }

  /* ===== Content Area ===== */
  .content-section {
    display: none;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 28px 32px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .content-section.active { display: block; }

  .section-label {
    font-size: 13px;
    color: var(--primary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .section-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 20px;
  }
  .section-conclusion {
    margin-top: 20px;
    padding: 12px 16px;
    background: #f8f9fb;
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--accent);
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
  }
  .section-conclusion strong { color: var(--text); }

  /* Chart */
  .chart-box { width: 100%; height: 380px; margin-bottom: 16px; }
  .chart-box.short { height: 280px; }

  /* Table */
  .data-table-wrap { overflow-x: auto; margin-bottom: 8px; }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table th, .data-table td {
    padding: 10px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .data-table th {
    background: #f9fafb;
    font-weight: 600;
    color: var(--text-secondary);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .data-table tr:hover td { background: #fafbfc; }
  .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .data-table .pct-bar {
    display: inline-block;
    height: 6px;
    border-radius: 3px;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: middle;
  }
  .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .tag-green { background: #ecfdf5; color: #065f46; }
  .tag-blue { background: #e8f0fe; color: #1a56db; }
  .tag-purple { background: #f3f0ff; color: #6c5ce7; }
  .tag-orange { background: #fff7ed; color: #c2410c; }

  /* ===== Overall Conclusions / 核心结论区 ===== */
  .overall-conclusions {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 28px 32px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .conclusion-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .conclusion-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    background: #f9fafb;
    border-radius: var(--radius-sm);
    font-size: 14px;
    line-height: 1.7;
    border-left: 3px solid var(--accent);
  }
  .conclusion-num {
    flex-shrink: 0;
    width: 26px; height: 26px;
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-secondary);
  }
  .empty-state-icon { font-size: 56px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }

  /* ===== KPI Row ===== */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .kpi-card .kpi-val { font-size: 28px; font-weight: 700; color: var(--text); }
  .kpi-card .kpi-lbl { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  /* Responsive */
  @media (max-width: 768px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .header h1 { font-size: 20px; }
    .content-section { padding: 20px 16px; }
    .chart-box { height: 280px; }
  }
</style>
</head>
<body>

<!-- ===== 标题说明区 ===== -->
<header class="header">
  <h1>📊 数据集分析看板</h1>
  <p class="header-desc">上传 Excel 文件，自动解析并可视化数据分布，生成核心结论</p>
</header>

<!-- ===== 文件上传区 ===== -->
<div class="upload-section" id="uploadSection">
  <div class="drop-zone" id="dropZone"
       ondragover="event.preventDefault(); this.classList.add('drag-over')"
       ondragleave="this.classList.remove('drag-over')"
       ondrop="handleDrop(event)"
       onclick="document.getElementById('fileInput').click()">
    <div class="drop-zone-icon">📂</div>
    <div class="drop-zone-text">把 .xlsx 拖到这里 / 或点击下方按钮选择</div>
    <div class="drop-zone-hint">单文件 ≤100MB · 支持 .xlsx / .xls</div>
    <button class="upload-btn" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">
      📁 选择 Excel
    </button>
  </div>
  <div class="file-loaded" id="fileLoaded">✅ 已加载：<span id="loadedFileName"></span></div>
  <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="handleFile(event)">
</div>

<div class="container" id="mainContainer">

  <!-- ===== KPI 概览卡 ===== -->
  <div class="kpi-row" id="kpiRow" style="display:none;"></div>

  <!-- ===== 标签导航区 ===== -->
  <div class="tab-nav-wrap" id="tabNavWrap" style="display:none;">
    <div class="tab-nav" id="tabNav"></div>
  </div>

  <!-- ===== 核心图表/表格区 ===== -->
  <div id="tabContent"></div>

  <!-- ===== 核心结论区 ===== -->
  <div class="overall-conclusions" id="conclusionsWrap" style="display:none;">
    <div class="section-label">💡 核心结论</div>
    <div class="section-title" style="font-size:18px;">数据洞察与关键发现</div>
    <ul class="conclusion-list" id="conclusionList"></ul>
  </div>

</div>

<script>
// ============================================================
// 全局状态
// ============================================================
let gWorkbook = null;
let gData = [];           // 当前 sheet 的 JSON 数据
let gHeaders = [];        // 当前 sheet 的表头
let gChartInst = null;    // 当前图表实例
let gActiveTab = '';

// ============================================================
// 标签配置
// ============================================================
const TAB_CONFIG = [
  { id: 'p_date',       label: '时间范围 (p_date)',       icon: '📅' },
  { id: 'biz',          label: '业务来源 (biz)',          icon: '🏢' },
  { id: 'model',        label: '模型版本 (model)',        icon: '🤖' },
  { id: 'membership',   label: '会员类型 (membership_type)', icon: '👤' },
  { id: 'resolution',   label: '视频分辨率',              icon: '📐' },
  { id: 'duration',     label: '视频时长 (duration)',     icon: '⏱️' },
  { id: 'multi_shots',  label: '多镜头偏好',              icon: '🎬' },
  { id: 'gen_audio',    label: '音频生成',               icon: '🔊' },
  { id: 'ref_input',    label: '用户输入分析',           icon: '🖼️' },
  { id: 'prompt',       label: 'Prompt',                icon: '📝' },
  { id: 'pe_result',    label: 'PE 增强结果',            icon: '🔍' },
  { id: 'user_analysis',label: '用户分析',               icon: '👥' },
  { id: 'req_status',   label: '请求状态',               icon: '✅' },
  { id: 'effect_model', label: '效果模型',               icon: '⚙️' },
];

// ============================================================
// 文件处理
// ============================================================
function handleFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  readFile(file);
}

function handleDrop(event) {
  event.preventDefault();
  event.target.classList.remove('drag-over');
  const file = event.dataTransfer.files[0];
  if (!file) return;
  readFile(file);
}

function readFile(file) {
  if (!file.name.match(/\.xlsx?$/i)) { alert('请上传 .xlsx 或 .xls 格式的文件'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      gWorkbook = XLSX.read(data, { type: 'array' });
      const sheetName = gWorkbook.SheetNames[0];
      const ws = gWorkbook.Sheets[sheetName];
      gData = XLSX.utils.sheet_to_json(ws, { defval: '' });
      gHeaders = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' })[0].map(h => String(h).trim());
      document.getElementById('loadedFileName').textContent = file.name;
      document.getElementById('fileLoaded').classList.add('show');
      document.getElementById('kpiRow').style.display = 'grid';
      document.getElementById('tabNavWrap').style.display = 'block';
      document.getElementById('conclusionsWrap').style.display = 'block';
      initAll();
    } catch (err) {
      alert('文件解析失败: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ============================================================
// 初始化
// ============================================================
function initAll() {
  renderKPIs();
  renderTabNav();
  switchTab(TAB_CONFIG[0].id);
  generateOverallConclusions();
}

// ============================================================
// 工具函数
// ============================================================
function col(name) {
  // 查找列索引（大小写不敏感，模糊匹配）
  const lower = name.toLowerCase();
  for (const h of gHeaders) {
    if (h.toLowerCase() === lower) return h;
  }
  // 模糊匹配
  for (const h of gHeaders) {
    if (h.toLowerCase().includes(lower)) return h;
  }
  return null;
}

function colVals(name) {
  const h = col(name);
  if (!h) return [];
  return gData.map(r => r[h] !== undefined && r[h] !== null ? r[h] : '');
}

// 日期格式化：20260607 / 2026-06-07 / 2026/06/07 → 2026年6月7日
function formatDate(raw) {
  const s = String(raw).trim();
  // 纯数字 8位 YYYYMMDD
  if (/^\d{8}$/.test(s)) {
    const y = parseInt(s.substring(0,4),10);
    const m = parseInt(s.substring(4,6),10);
    const d = parseInt(s.substring(6,8),10);
    return `${y}年${m}月${d}日`;
  }
  // 带分隔符 YYYY-MM-DD 或 YYYY/MM/DD
  const m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (m) {
    return `${parseInt(m[1],10)}年${parseInt(m[2],10)}月${parseInt(m[3],10)}日`;
  }
  return s;
}

function pct(val, total) {
  return total > 0 ? (val / total * 100).toFixed(1) : '0.0';
}

function tryParseJSON(str) {
  try { return JSON.parse(str); } catch(e) { return null; }
}

// 析构旧图表
function disposeChart() {
  if (gChartInst) { gChartInst.dispose(); gChartInst = null; }
}

// ============================================================
// KPI 卡片
// ============================================================
function renderKPIs() {
  const rows = gData.length;
  const cols = gHeaders.length;

  // 日期范围
  let dateRange = '—';
  const dCol = col('p_date');
  if (dCol) {
    const vals = [...new Set(gData.map(r => String(r[dCol]||'')))].filter(v => v).sort();
    if (vals.length === 1) dateRange = formatDate(vals[0]);
    else if (vals.length > 1) dateRange = formatDate(vals[0]) + ' ~ ' + formatDate(vals[vals.length-1]);
  }

  // 空值率
  let totalCells = 0, totalNulls = 0;
  for (const h of gHeaders) {
    for (const r of gData) {
      totalCells++;
      const v = r[h];
      if (v === '' || v === null || v === undefined) totalNulls++;
    }
  }
  const fillRate = totalCells > 0 ? ((1 - totalNulls/totalCells)*100).toFixed(1) : '100.0';

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card"><div class="kpi-val">${rows.toLocaleString()}</div><div class="kpi-lbl">📊 总行数</div></div>
    <div class="kpi-card"><div class="kpi-val">${cols}</div><div class="kpi-lbl">📐 总列数</div></div>
    <div class="kpi-card"><div class="kpi-val" style="font-size:${dateRange.length>15?'16px':'22px'};">${dateRange}</div><div class="kpi-lbl">📅 数据日期</div></div>
    <div class="kpi-card"><div class="kpi-val">${fillRate}%</div><div class="kpi-lbl">✅ 数据完整率</div></div>
  `;
}

// ============================================================
// 标签导航
// ============================================================
function renderTabNav() {
  document.getElementById('tabNav').innerHTML = TAB_CONFIG.map(t =>
    `<button class="tab-btn" data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}</button>`
  ).join('');
}

function switchTab(tabId) {
  gActiveTab = tabId;
  // 高亮
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tabId);
  });

  disposeChart();

  // 渲染内容
  const container = document.getElementById('tabContent');
  const fn = RENDERERS[tabId];
  if (fn) {
    container.innerHTML = fn();
  } else {
    container.innerHTML = `<div class="content-section active"><p>该分析维度开发中...</p></div>`;
  }

  // 重新激活图表
  setTimeout(() => {
    const chartDom = document.getElementById('activeChart');
    const chartFn = CHART_RENDERERS[tabId];
    if (chartDom && chartFn) chartFn(chartDom);
  }, 150);
}

// ============================================================
// HTML 模板辅助
// ============================================================
function sectionHTML(label, title, body, conclusion) {
  return `<div class="content-section active">
    <div class="section-label">${label}</div>
    <div class="section-title">${title}</div>
    ${body}
    ${conclusion ? `<div class="section-conclusion">💡 ${conclusion}</div>` : ''}
  </div>`;
}

function chartHTML(height) {
  return `<div class="chart-box${height==='short'?' short':''}" id="activeChart"></div>`;
}

function tableHTML(headers, rows, opts={}) {
  const hhtml = headers.map((h, j) => {
    const align = (opts.aligns && opts.aligns[j] === 'right') ? ' num' : '';
    return `<th class="${align}">${h}</th>`;
  }).join('');
  const rhtml = rows.map((row, i) => {
    const cls = opts.rowClass ? opts.rowClass(row, i) : '';
    return `<tr class="${cls}">${row.map((cell, j) => {
      const align = (opts.aligns && opts.aligns[j] === 'right') ? ' num' : '';
      return `<td class="${align}">${cell}</td>`;
    }).join('')}</tr>`;
  }).join('');
  return `<div class="data-table-wrap"><table class="data-table"><thead><tr>${hhtml}</tr></thead><tbody>${rhtml}</tbody></table></div>`;
}

// ============================================================
// 图表渲染器（横向条形图为主）
// ============================================================
function renderHBarChart(dom, categories, values, title) {
  if (!dom) return;
  disposeChart();
  const chart = echarts.init(dom);
  gChartInst = chart;

  // 颜色渐变
  const colors = ['#6c5ce7','#4a90d9','#7c6ff7','#5b9ed4','#8b7df7','#3a80c9','#9b8df7','#2d70b8','#ab9df7','#1d60a7'];

  chart.setOption({
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'shadow' },
      formatter: function(params) {
        const p = params[0];
        return `${p.name}<br/>数量: <b>${p.value}</b> (${pct(p.value, values.reduce((a,b)=>a+b,0))}%)`;
      }
    },
    grid: { left: '3%', right: '8%', bottom: '3%', top: '5%', containLabel: true },
    xAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#f0f0f5' } } },
    yAxis: {
      type: 'category',
      data: categories,
      inverse: true,
      axisLine: { show: false },
      axisTick: { show: false },
      axisLabel: { fontSize: 12, color: '#4b5563' }
    },
    series: [{
      type: 'bar',
      data: values.map((v, i) => ({
        value: v,
        itemStyle: { color: colors[i % colors.length], borderRadius: [0, 4, 4, 0] }
      })),
      barMaxWidth: 32,
      label: { show: true, position: 'right', fontSize: 11, color: '#6b7280', formatter: '{c}' }
    }]
  });
}

function renderPieChart(dom, data) {
  if (!dom) return;
  disposeChart();
  const chart = echarts.init(dom);
  gChartInst = chart;

  chart.setOption({
    tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
    legend: { type: 'scroll', bottom: 0, textStyle: { fontSize: 11 } },
    series: [{
      type: 'pie',
      radius: ['50%', '75%'],
      center: ['50%', '45%'],
      itemStyle: { borderRadius: 4, borderColor: '#fff', borderWidth: 2 },
      label: { formatter: '{b}\n{d}%', fontSize: 11 },
      data: data,
      emphasis: { label: { fontSize: 14, fontWeight: 'bold' } }
    }]
  });
}

// ============================================================
// 各标签的内容渲染器（返回 HTML 字符串）
// ============================================================
const RENDERERS = {

  // 1. p_date
  p_date: function() {
    const h = col('p_date');
    if (!h) return sectionHTML('📅 时间范围', '时间范围 (p_date)', '<p style="color:var(--text-secondary)">未找到 p_date 列</p>');
    const freq = {};

  // 5. 视频分辨率
  resolution: function() {
    const wCol = col('video_width'), hCol = col('video_height');
    if (!wCol || !hCol) return sectionHTML('📐 视频分辨率', '视频分辨率', '<p style="color:var(--text-secondary)">未找到 video_width / video_height 列</p>');
    // 统计分辨率组合
    const combo = {};
    gData.forEach(r => {
      const w = r[wCol], h = r[hCol];
      const key = `${w}×${h}`;
      combo[key] = (combo[key]||0) + 1;
    });
    const sorted = Object.entries(combo).sort((a,b) => b[1]-a[1]).slice(0, 15);
    const total = gData.length;
    const rows = sorted.map(([res, cnt]) => {
      const [w, h] = res.split('×').map(Number);
      let orientation = '方屏';
      if (w/h > 1.15) orientation = '🖥️ 横屏';
      else if (w/h < 0.85) orientation = '📱 竖屏';
      return [res, cnt.toLocaleString(), orientation, pct(cnt, total)+'%'];
    });
    // 方向统计
    let land=0, port=0, sq=0;
    gData.forEach(r => {
      const w=Number(r[wCol]), h=Number(r[hCol]);
      if (!w||!h) return;
      if (w/h>1.15) land++; else if (w/h<0.85) port++; else sq++;
    });
    const conclusion = `共 <strong>${Object.keys(combo).length}</strong> 种分辨率组合，横屏 <strong>${land}条(${pct(land,total)}%)</strong>、竖屏 <strong>${port}条(${pct(port,total)}%)</strong>、方屏 <strong>${sq}条(${pct(sq,total)}%)</strong>，Top 1 为 <strong>${sorted[0]?.[0]}</strong>。`;
    return sectionHTML('📐 视频分辨率', '视频分辨率 (video_width × video_height)',
      chartHTML() + tableHTML(['分辨率', '数量', '方向', '占比'], rows, {aligns:[null,'right',null,'right']}),
      conclusion);
  },

  // 6. duration
  duration: function() {
    const h = col('duration');
    if (!h) return sectionHTML('⏱️ 视频时长', '视频时长 (duration)', '<p style="color:var(--text-secondary)">未找到 duration 列</p>');
    const freq = {};
    gData.forEach(r => {
      let v = String(r[h]||'').trim().toLowerCase().replace(/s$/i,'');
      const n = parseFloat(v);
      if (!isNaN(n)) {
        // 归入区间
        let bucket;
        if (n <= 3) bucket = '≤3s';
        else if (n <= 5) bucket = '3-5s';
        else if (n <= 8) bucket = '5-8s';
        else if (n <= 12) bucket = '8-12s';
        else bucket = '12-15s';
        freq[bucket] = (freq[bucket]||0) + 1;
      }
    });
    const order = ['≤3s','3-5s','5-8s','8-12s','12-15s'];
    const sorted = order.filter(k => freq[k]).map(k => [k, freq[k]]);
    const total = gData.length;
    const rows = sorted.map(([name, cnt]) => [name, cnt.toLocaleString(), pct(cnt, total)+'%']);
    // 计算平均时长
    let sum=0, count=0;
    gData.forEach(r => { const n=parseFloat(String(r[h]||'').trim().toLowerCase().replace(/s$/i,'')); if(!isNaN(n)){sum+=n;count++;} });
    const avg = count>0 ? (sum/count).toFixed(1) : '—';
    const conclusion = `平均时长 <strong>${avg}s</strong>，<strong>"${sorted[0]?.[0]}"</strong> 区间占比最高（${pct(sorted[0]?.[1]||0, total)}%），5s 及以下短视频为主流。`;
    return sectionHTML('⏱️ 视频时长', '视频时长 (duration)',
      chartHTML('short') + tableHTML(['时长区间', '数量', '占比'], rows, {aligns:[null,'right','right']}),
      conclusion);

  // 10. Prompt
  prompt: function() {
    const h = col('prompt');
    if (!h) return sectionHTML('📝 Prompt', 'Prompt 分析', '<p style="color:var(--text-secondary)">未找到 prompt 列</p>');
    const vals = gData.map(r => String(r[h]||''));
    const lens = vals.map(v => v.length);
    const avgLen = (lens.reduce((a,b)=>a+b,0) / lens.length).toFixed(0);
    const minLen = Math.min(...lens), maxLen = Math.max(...lens);

    // 语言检测
    let cn=0, en=0, mx=0;
    vals.forEach(v => {
      const cjk = (v.match(/[一-鿿㐀-䶿]/g)||[]).length;
      const eng = (v.match(/[a-zA-Z]/g)||[]).length;
      if (cjk > eng) cn++; else if (eng > cjk) en++; else mx++;
    });

    // 长度分布
    const bins = [[0,50],[50,100],[100,200],[200,300],[300,500],[500,1000],[1000,99999]];
    const binLabels = ['0-50','50-100','100-200','200-300','300-500','500-1000','1000+'];
    const binCounts = bins.map(([lo,hi]) => lens.filter(l => l>=lo && l<hi).length);

    const total = gData.length;
    const langRows = [
      ['英文为主', en.toLocaleString(), pct(en, total)+'%'],
      ['中文为主', cn.toLocaleString(), pct(cn, total)+'%'],
      ['中英混合/其他', mx.toLocaleString(), pct(mx, total)+'%'],
    ];
    const lenRows = binLabels.map((label, i) => [label, binCounts[i].toLocaleString(), pct(binCounts[i], total)+'%']);
    const conclusion = `平均 Prompt 长度 <strong>${avgLen}</strong> 字符（最短 ${minLen}，最长 ${maxLen}），英文为主占 <strong>${pct(en,total)}%</strong>，中文为主占 <strong>${pct(cn,total)}%</strong>，长度集中在 <strong>"${binLabels[binCounts.indexOf(Math.max(...binCounts))]}"</strong> 区间。`;

    return sectionHTML('📝 Prompt', 'Prompt 分析',
      `<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px;">
        <div>
          <h4 style="font-size:14px;margin-bottom:10px;color:var(--text);">🌐 语言分布</h4>
          ${tableHTML(['语言', '数量', '占比'], langRows, {aligns:[null,'right','right']})}
        </div>
        <div>
          <h4 style="font-size:14px;margin-bottom:10px;color:var(--text);">📏 长度分布</h4>
          <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">平均: <strong>${avgLen}</strong> 字符 · 中位数: <strong>${lens.sort((a,b)=>a-b)[Math.floor(lens.length/2)]}</strong></p>
          ${tableHTML(['长度区间', '数量', '占比'], lenRows, {aligns:[null,'right','right']})}
        </div>
      </div>`,
      conclusion);
  },

  // 13. 请求状态
  req_status: function() {
    const h = col('response');
    if (!h) return sectionHTML('✅ 请求状态', '请求状态', '<p style="color:var(--text-secondary)">未找到 response 列</p>');
    let success=0, fail=0, terminated=0;
    gData.forEach(r => {
      const resp = tryParseJSON(r[h] || '{}');
      if (resp?.status?.code === 1 || resp?.status?.code === 0) success++;
      else fail++;
      if (resp?.status?.terminated) terminated++;
    });
    const total = gData.length;
    const conclusion = `全部 <strong>${total}</strong> 条请求中，<strong>${success}</strong> 条成功（${pct(success,total)}%）${terminated>0?'，'+terminated+' 条已终止完成':''}，整体服务稳定性表现优异。`;
    return sectionHTML('✅ 请求状态', '请求状态',
      `<div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px;">

  resolution:   function(dom) { chartResolution(dom); },
  duration:     function(dom) { chartDuration(dom); },
  multi_shots:  function(dom) { chartBarFromFreq(dom, col('prefer_multi_shots')); },
  gen_audio:    function(dom) { chartBarFromFreq(dom, col('is_gen_audio')); },
  ref_input:    function(dom) { chartRefInput(dom); },
  effect_model: function(dom) { chartEffectModel(dom); },
};

function chartBarFromFreq(dom, h) {
  if (!dom || !h) return;
  const freq = {};
  gData.forEach(r => { const v = String(r[h]||'(空)'); freq[v] = (freq[v]||0)+1; });
  const sorted = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0, 12);
  const names = sorted.map(e => e[0].length>25?e[0].substring(0,22)+'…':e[0]);
  const values = sorted.map(e => e[1]);
  renderHBarChart(dom, names, values);
}

function chartResolution(dom) {
  if (!dom) return;
  const wCol = col('video_width'), hCol = col('video_height');
  if (!wCol || !hCol) return;
  const combo = {};
  gData.forEach(r => {
    const w = r[wCol], h = r[hCol];
    combo[`${w}×${h}`] = (combo[`${w}×${h}`]||0)+1;
  });
  const sorted = Object.entries(combo).sort((a,b) => b[1]-a[1]).slice(0, 12);
  const names = sorted.map(e => e[0]);
  const values = sorted.map(e => e[1]);
  renderHBarChart(dom, names, values);
}

function chartDuration(dom) {
  if (!dom) return;
  const h = col('duration');
  if (!h) return;
  const freq = {};
  gData.forEach(r => {
    let v = String(r[h]||'').trim().toLowerCase().replace(/s$/i,'');
    const n = parseFloat(v);
    if (!isNaN(n)) {
      let bucket;
      if (n<=3) bucket='≤3s'; else if (n<=5) bucket='3-5s'; else if (n<=8) bucket='5-8s'; else if (n<=12) bucket='8-12s'; else bucket='12-15s';
      freq[bucket] = (freq[bucket]||0)+1;
    }
  });
  const order = ['≤3s','3-5s','5-8s','8-12s','12-15s'];
  const sorted = order.filter(k=>freq[k]).map(k=>[k,freq[k]]);
  renderHBarChart(dom, sorted.map(e=>e[0]), sorted.map(e=>e[1]));
}

function chartRefInput(dom) {
  if (!dom) return;
  let hasImg=0, hasVid=0, hasSub=0;
  gData.forEach(r => {
    const img=tryParseJSON(r[col('refer_image_list')]||'{}');
    const vid=tryParseJSON(r[col('refer_video_list')]||'{}');
    const sub=String(r[col('subject_list')]||'[]');
    if (img?.mediaDataArray?.mediaDataElems?.length>0) hasImg++;
    if (vid?.mediaDataArray?.mediaDataElems?.length>0) hasVid++;
    if (sub!=='[]'&&sub!=='') hasSub++;
  });
  renderHBarChart(dom, ['参考图片','参考视频','参考主体'], [hasImg, hasVid, hasSub]);
}

function chartEffectModel(dom) {
  if (!dom) return;
  const h = col('effect_model');
  if (!h) return;
  const freq = {};
  gData.forEach(r => { const v=String(r[h]||'(空)'); freq[v]=(freq[v]||0)+1; });
  const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,12);
  renderHBarChart(dom, sorted.map(e=>e[0].length>30?e[0].substring(0,27)+'…':e[0]), sorted.map(e=>e[1]));
}

// ============================================================
// 核心结论自动生成
// ============================================================
function generateOverallConclusions() {
  const conclusions = [];

  // 数据概览
  conclusions.push(`本数据集共包含 <strong>${gData.length}</strong> 条记录、<strong>${gHeaders.length}</strong> 个字段。`);

  // 模型
  const mh = col('model');
  if (mh) {
    const freq = {};
    gData.forEach(r => { const v=String(r[mh]||''); if(v) freq[v]=(freq[v]||0)+1; });
    const sorted = Object.entries(freq).sort((a,b)=>b[1]-a[1]);
    if (sorted.length>0) {
      conclusions.push(`模型层面，「<strong>${sorted[0][0]}</strong>」是绝对主力，占 <strong>${pct(sorted[0][1],gData.length)}%</strong>${sorted.length>1?'，其次为「'+sorted[1][0]+'」占 '+pct(sorted[1][1],gData.length)+'%':''}。`);
    }
  }

  // 图生视频
  let hasImg=0;
  gData.forEach(r => {
    const img=tryParseJSON(r[col('refer_image_list')]||'{}');
    if (img?.mediaDataArray?.mediaDataElems?.length>0) hasImg++;
  });
  conclusions.push(`<strong>${pct(hasImg,gData.length)}%</strong> 的请求包含参考图片，图生视频为核心使用场景。`);

  // 会员
  const memH = col('membership_type');
  if (memH) {
    const freq = {};
    gData.forEach(r => { const v=String(r[memH]||''); if(v&&v!=='') freq[v]=(freq[v]||0)+1; });
    const total = Object.values(freq).reduce((a,b)=>a+b,0);
    const vipTotal = Object.entries(freq).filter(([k])=>k.includes('VIP')||k.includes('vip')).reduce((s,[,c])=>s+c,0);
    if (total>0) conclusions.push(`有效会员中付费用户（含各等级 VIP）占比约 <strong>${pct(vipTotal,total)}%</strong>，高质量付费用户是核心群体。`);
  }

  // 音频
  const audH = col('is_gen_audio');
  if (audH) {
    let audioTrue=0;
    gData.forEach(r => { if(String(r[audH]||'')==='True'||String(r[audH]||'')==='true') audioTrue++; });
    conclusions.push(`超 <strong>${pct(audioTrue,gData.length)}%</strong> 请求生成音频，Kling 3.0 Omni 多模态能力被充分使用。`);
  }

  // 分辨率方向
  const wCol=col('video_width'), hCol2=col('video_height');
  if (wCol&&hCol2) {
    let land=0,port=0;
    gData.forEach(r => { const w=Number(r[wCol]),h=Number(r[hCol2]); if(w&&h){ if(w/h>1.15)land++; else if(w/h<0.85)port++; } });
    conclusions.push(`视频方向：横屏 <strong>${land}条</strong>，竖屏 <strong>${port}条</strong>，${land>port?'横屏为主流':'竖屏占比突出'}。`);
  }

  // 成功率
  const respH = col('response');
  if (respH) {
    let ok=0;
    gData.forEach(r => { const resp=tryParseJSON(r[respH]||'{}'); if(resp?.status?.code===1||resp?.status?.code===0) ok++; });
    if (ok===gData.length) conclusions.push(`请求成功率 <strong>100%</strong>，技术稳定性表现优秀。`);
    else conclusions.push(`请求成功率 <strong>${pct(ok,gData.length)}%</strong>（${ok}/${gData.length}）。`);
  }

  document.getElementById('conclusionList').innerHTML = conclusions.map((c,i)=>
    `<li class="conclusion-item"><span class="conclusion-num">${i+1}</span><span>${c}</span></li>`
  ).join('');
}
